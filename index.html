<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>الانتخابات التأسيسية لنقابة المبرمجين العراقيين – المقر العام</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1E2329; --paper:#EFF0F2; --card:#FFFFFF;
  --green:#E2722A; --green-soft:#FBEADE;
  --gold:#E1A11C; --gold-soft:#FBF1D9;
  --muted:#6B7280; --line:#E4E7EB;
  --fail:#A63A2B; --pass:#1B7A4A; --radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Cairo',Tahoma,Arial,sans-serif;background:var(--paper);color:var(--ink);
  line-height:1.7;font-variant-numeric:tabular-nums}
header{background:var(--card);color:var(--ink);padding:30px 20px 22px;text-align:center;border-bottom:1px solid var(--line)}
header .eyebrow{font-size:.78rem;letter-spacing:.4px;color:var(--muted);font-weight:600;margin-bottom:8px}
header h1{font-size:1.4rem;font-weight:800;line-height:1.5}
header h1 .p{color:var(--green)}
header .rule{display:flex;gap:4px;justify-content:center;width:72px;margin:12px auto 10px}
header .rule span{height:5px;border-radius:3px;flex:1}
header .rule .o{background:var(--green)} header .rule .y{background:var(--gold)}
header p{font-size:.85rem;color:var(--muted);margin-top:4px}
main{max-width:480px;margin:0 auto;padding:24px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:18px}
label{font-size:.85rem;font-weight:600;display:block;margin-bottom:5px}
input[type=text]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-family:inherit;
  font-size:1rem;font-weight:600;text-align:center;letter-spacing:1px;background:#fff;color:var(--ink)}
input[type=text]:focus{outline:2px solid var(--green);outline-offset:1px}
.btn{font-family:inherit;font-size:.9rem;font-weight:700;border:none;border-radius:8px;padding:10px 18px;cursor:pointer}
.btn-outline{background:#fff;color:var(--green);border:1.5px solid var(--green)}
.btn-outline:hover{background:var(--green-soft)}
.check-btn{width:100%;margin-top:10px}
.result-box{margin-top:16px;border-radius:var(--radius);padding:20px;text-align:center;display:none}
.result-box.show{display:block}
.result-box .icon{font-size:36px;line-height:1;margin-bottom:8px;display:block}
.result-box .title{font-weight:800;font-size:1.05rem;margin-bottom:4px}
.result-box .sub{font-weight:700;font-size:.95rem}
.result-box .name{font-weight:700;font-size:1rem;margin-bottom:6px;opacity:.95}
.result-box .meta{font-size:.8rem;opacity:.85;margin-top:2px}
.result-box .details{background:rgba(255,255,255,.15);border-radius:8px;padding:8px 12px;margin:8px 0;text-align:right}
.result-box .details div{font-size:.8rem;line-height:1.7}
.result-box.v-fail .details,.result-box.v-notice .details{background:rgba(0,0,0,.04)}
.match-list{margin-top:10px;text-align:right}
.match-row{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid var(--line);
  border-radius:8px;padding:8px 12px;margin-bottom:6px;font-size:.85rem;color:var(--ink)}
.match-row .match-serial{font-weight:800;color:var(--green)}
.match-more{font-size:.75rem;color:#6B5410;margin-top:6px;text-align:center}
.result-box.v-pass{background:var(--pass);color:#fff}
.result-box.v-fail{background:var(--fail);color:#fff}
.result-box.v-notice{background:var(--gold-soft);border-right:4px solid var(--gold);color:#6B5410;text-align:right}
.result-box.v-notice .title{font-size:.9rem;font-weight:700}
footer{max-width:480px;margin:10px auto 24px;padding:0 16px;text-align:center}
footer .credit{font-size:.85rem;color:var(--ink);font-weight:700;margin-bottom:6px}
footer .credit b{color:var(--green)}
footer .disc{font-size:.72rem;color:var(--muted)}
</style>
</head>

<header>
  <div class="eyebrow">لجنة شؤون الأعضاء والانتماء</div>
  <h1>الانتخابات <span class="p">التأسيسية</span> لنقابة المبرمجين العراقيين – المقر العام</h1>
  <div class="rule"><span class="o"></span><span class="y"></span></div>
  <p>أدخل رقم التسلسل أو الاسم للتحقق من استحقاق التخفيض</p>
</header>

<main>
  <div class="card">
    <label for="serial">رقم التسلسل أو الاسم</label>
    <input type="text" id="serial" autocomplete="off" placeholder="مثال: 1234 أو الاسم الكامل">
    <button id="checkBtn" type="button" class="btn btn-outline check-btn">تحقق</button>

    <div id="result" class="result-box"></div>
  </div>
</main>

<footer>
  <div class="disc">أداة تحقق استرشادية وفق قوائم المشاركين المعتمدة في الانتخابات التأسيسية لنقابة المبرمجين العراقيين.</div>
</footer>

42:{n:'عماد عبدالحسين محمد صالح حسين'},10143:{n:'مهند عبدالرزاق هاشم زهرو الحمد'},10148:{n:'سامر بيان علي عبد علي'},10149:{n:'علي كامل محسن عباس'},10151:{n:'دلال نوفل حامد علي'},10152:{n:'عزام علي جاسم يوسف'},10153:{n:'اسراء ناصر عبودحسن'},10154:{n:'محمود هاشم سلطان حامد'},10155:{n:'مصطفى ذنون عبد الله جاسم'},10156:{n:'محمد هاشم سلطان حامد'},10157:{n:'منهل نوفل قاسم علي'},10158:{n:'رحمة وليد عبد الجبار سلطان'},10160:{n:'اسراء اياد حمدي ابراهيم'},10161:{n:'نجلاء احسان غازي حسين'},10162:{n:'رشا جمال حسين الجراح'},10166:{n:'هيفاء محمد فتح الله سعيد'},10167:{n:'وميض جودة عبد درويش'},10168:{n:'حارث خليل اسماعيل ال جعفر'},10169:{n:'فراس ضياء هادي صالح'},10183:{n:'محمد اوميد فتاح عزيز'}};
  const DISCOUNT_AMOUNT = 35000;

  const input = document.getElementById('serial');
  const btn = document.getElementById('checkBtn');
  const result = document.getElementById('result');

  function normalizeSerial(raw) {
    const digitMap = {
      '٠': '0', '١': '1', '٢': '2', '٣': '3', '٤': '4', '٥': '5', '٦': '6', '٧': '7', '٨': '8', '٩': '9',
      '۰': '0', '۱': '1', '۲': '2', '۳': '3', '۴': '4', '۵': '5', '۶': '6', '۷': '7', '۸': '8', '۹': '9'
    };
    const converted = raw.trim().replace(/[٠-٩۰-۹]/g, function (d) { return digitMap[d]; });
    const digitsOnly = converted.replace(/[^0-9]/g, '');
    return digitsOnly === '' ? null : parseInt(digitsOnly, 10);
  }

  function normalizeArabicText(s) {
    return s
      .replace(/[ً-ْٰـ]/g, '')
      .replace(/[إأآا]/g, 'ا')
      .replace(/ى/g, 'ي')
      .replace(/ة/g, 'ه')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function buildDetails(info) {
    const details = [];
    if (info.p) details.push('المحافظة: ' + info.p);
    if (info.c) details.push('الجامعة / الكلية: ' + info.c);
    if (info.d) details.push('القسم: ' + info.d);
    return details;
  }

  function renderResult(type, icon, title, sub, name, meta, details) {
    result.className = 'result-box show ' + type;
    const detailsHtml = (details && details.length)
      ? '<div class="details">' + details.map(function (d) { return '<div>' + d + '</div>'; }).join('') + '</div>'
      : '';
    result.innerHTML =
      '<span class="icon">' + icon + '</span>' +
      (name ? '<div class="name">' + name + '</div>' : '') +
      '<div class="title">' + title + '</div>' +
      (meta ? '<div class="meta">' + meta + '</div>' : '') +
      detailsHtml +
      (sub ? '<div class="sub">' + sub + '</div>' : '');
  }

  function renderMatchList(matches) {
    const shown = matches.slice(0, 15);
    result.className = 'result-box show v-notice';
    const rows = shown.map(function (serial) {
      return '<div class="match-row"><span class="match-name">' + PARTICIPANTS[serial].n + '</span>' +
        '<span class="match-serial">' + serial + '</span></div>';
    }).join('');
    const more = matches.length > shown.length
      ? '<div class="match-more">و' + (matches.length - shown.length) + ' نتيجة أخرى — دقّق البحث بإدخال الاسم كاملاً</div>'
      : '';
    result.innerHTML =
      '<div class="title">تم العثور على ' + matches.length + ' نتيجة مطابقة، اختر رقم التسلسل الصحيح:</div>' +
      '<div class="match-list">' + rows + '</div>' + more;
  }

  function doCheck() {
    const value = input.value.trim();

    if (value === '') {
      renderResult('v-notice', '⚠', 'الرجاء إدخال رقم التسلسل أو الاسم');
      return;
    }

    const isNumericInput = /^[0-9٠-٩۰-۹\s]+$/.test(value);

    if (isNumericInput) {
      const serial = normalizeSerial(value);

      if (serial === null) {
        renderResult('v-notice', '⚠', 'الرجاء إدخال رقم تسلسل صحيح');
        return;
      }

      if (Object.prototype.hasOwnProperty.call(PARTICIPANTS, serial)) {
        const info = PARTICIPANTS[serial];
        renderResult(
          'v-pass',
          '✓',
          'مشارك بالانتخابات التأسيسية',
          'التخفيض المستحق: ' + DISCOUNT_AMOUNT.toLocaleString('en-US') + ' د.ع',
          info.n,
          null,
          buildDetails(info)
        );
      } else {
        renderResult(
          'v-fail',
          '✕',
          'غير مشارك بالانتخابات التأسيسية',
          'لا يوجد تخفيض مستحق'
        );
      }
      return;
    }

    const query = normalizeArabicText(value);

    if (query.length < 2) {
      renderResult('v-notice', '⚠', 'الرجاء إدخال جزء أوضح من الاسم');
      return;
    }

    const matches = Object.keys(PARTICIPANTS).filter(function (serial) {
      return normalizeArabicText(PARTICIPANTS[serial].n).indexOf(query) !== -1;
    });

    if (matches.length === 0) {
      renderResult(
        'v-fail',
        '✕',
        'غير مشارك بالانتخابات التأسيسية',
        'لا يوجد تخفيض مستحق'
      );
    } else if (matches.length === 1) {
      const serial = matches[0];
      const info = PARTICIPANTS[serial];
      renderResult(
        'v-pass',
        '✓',
        'مشارك بالانتخابات التأسيسية',
        'التخفيض المستحق: ' + DISCOUNT_AMOUNT.toLocaleString('en-US') + ' د.ع',
        info.n,
        'رقم التسلسل: ' + serial,
        buildDetails(info)
      );
    } else {
      renderMatchList(matches);
    }
  }

  btn.addEventListener('click', doCheck);
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') doCheck();
  });
</script>
