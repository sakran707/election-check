      '<div class="title">' + title + '</div>' +
      (sub ? '<div class="sub">' + sub + '</div>' : '');
  }

  function doCheck() {
    const value = input.value.trim();

    if (value === '') {
      renderResult('v-notice', '⚠', 'الرجاء إدخال رقم التسلسل');
      return;
    }

    const serial = normalizeSerial(value);

    if (serial === null) {
      renderResult('v-notice', '⚠', 'الرجاء إدخال رقم تسلسل صحيح');
      return;
    }

    if (ELIGIBLE_SERIALS.has(serial)) {
      renderResult(
        'v-pass',
        '✓',
        'مشارك بالانتخابات التأسيسية',
        'التخفيض المستحق: ' + DISCOUNT_AMOUNT.toLocaleString('en-US') + ' د.ع'
      );
    } else {
      renderResult(
        'v-fail',
        '✕',
        'غير مشارك بالانتخابات التأسيسية',
        'لا يوجد تخفيض مستحق'
      );
    }
  }

  btn.addEventListener('click', doCheck);
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') doCheck();
  });
</script>
</body>
</html>
